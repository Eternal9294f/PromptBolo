openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: promptbolo
    description: PromptBolo prompt refinement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /promptbolo/refine:
    post:
      operationId: refinePrompt
      tags: [promptbolo]
      summary: Refine a rough prompt into a clear, detailed prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRefinementInput"
      responses:
        "200":
          description: Refined prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRefinement"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Prompt refinement is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Prompt refinement is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Prompt refinement rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PromptRefinementInput:
      type: object
      properties:
        sourceText:
          type: string
          minLength: 1
          maxLength: 12000
        mode:
          type: string
          enum: [saas, creator, weekend, general]
      required:
        - sourceText
        - mode
    PromptRefinement:
      type: object
      properties:
        refinedPrompt:
          type: string
      required:
        - refinedPrompt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

